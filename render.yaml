services:
  - type: web
    name: veritasscreen-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: CORS_ORIGIN
        value: https://sweater9.github.io
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_API_KEY
        sync: false
